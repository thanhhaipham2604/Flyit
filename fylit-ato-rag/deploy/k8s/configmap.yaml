# Non-secret configuration only. Anything with a credential in it belongs in the
# Secret next door - including DATABASE_URL, which carries a password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fylit-rag-config
  namespace: fylit-rag
data:
  CHUNKS_TABLE: "chunks"
  EMBEDDING_MODEL: "text-embedding-3-small"
  GENERATION_MODEL: "gpt-4o-mini"
  # fusion = no reranking on the query path. See ADR-0003: neither reranker beat
  # the baseline significantly, and the LLM one costs ~2.2s per query.
  RERANK_STRATEGY: "fusion"
  # Per replica, not per service - the limiter counts in process memory, so N
  # replicas allow N x this. See the note in api-deployment.yaml.
  RATE_LIMIT_PER_MINUTE: "30"
  # The query path caches query embeddings here. The root filesystem is
  # read-only (see api-deployment.yaml), so this must point at the writable
  # emptyDir mount - otherwise the cache silently degrades to "pay the API
  # every time", which is the failure mode hardest to notice.
  INDEX_DIR: "/tmp/index"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
