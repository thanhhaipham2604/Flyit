apiVersion: v1
kind: ConfigMap
metadata:
  name: fylit-rag-config
  namespace: fylit-rag
data:
  DATABASE_URL: "postgresql://fylit:fylit@postgres:5432/fylit"
  CHUNKS_TABLE: "chunks"
  RATE_LIMIT_PER_MINUTE: "30"
# NOTE: OPENAI_API_KEY belongs in a Secret, not here:
#   kubectl -n fylit-rag create secret generic fylit-rag-secrets \
#     --from-literal=OPENAI_API_KEY=sk-...
