# TEMPLATE ONLY - do not apply this file and do not commit real values.
#
# Create the real Secret from the command line so the credentials never enter
# git in any form:
#
#   kubectl -n fylit-rag create secret generic fylit-rag-secrets \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=POSTGRES_PASSWORD='<a real password>' \
#     --from-literal=DATABASE_URL='postgresql://fylit:<same password>@postgres:5432/fylit'
#
# DATABASE_URL lives here rather than in the ConfigMap because it embeds the
# password. Storing it alongside non-secret config is the most common way a
# database credential ends up in a git history.
apiVersion: v1
kind: Secret
metadata:
  name: fylit-rag-secrets
  namespace: fylit-rag
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://fylit:REPLACE_ME@postgres:5432/fylit"
