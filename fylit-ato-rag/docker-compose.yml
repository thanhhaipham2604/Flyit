# Local dev stack. Store choices (Qdrant + OpenSearch) are defaults pending ADR-0002.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - opensearch

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: LocalDev-Only-1!
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  qdrant_data:
  opensearch_data:
