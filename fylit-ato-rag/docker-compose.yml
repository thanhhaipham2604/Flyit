# Local dev stack. One store for both retrieval halves: Postgres + pgvector
# for embeddings, Postgres full-text search for keywords (ADR-0002).
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fylit:fylit@postgres:5432/fylit
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # pgvector ships the extension prebuilt; plain postgres:16 would need it
    # compiled in before CREATE EXTENSION vector could succeed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fylit
      POSTGRES_PASSWORD: fylit   # local dev only; k8s reads this from a Secret
      POSTGRES_DB: fylit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fylit -d fylit"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
