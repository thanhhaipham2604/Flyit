[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fylit-rag"
version = "0.1.0"
description = "Fylit ATO RAG system - RMIT capstone"
# 3.12+: ingestion/pipeline.py uses PEP 701 multi-line f-string expressions,
# and docker/api.Dockerfile builds on python:3.12-slim.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "markdown-it-py>=3.0",
    "slowapi>=0.1.9",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
fylit-ingest = "fylit_rag.ingestion.pipeline:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
